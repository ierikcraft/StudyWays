<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyWays - Tu Asistente de Estudio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>📚 StudyWays</h2>
            </div>
            <div class="history-container">
                <h3>Historial</h3>
                <div id="history-list" class="history-list">
                    <!-- History items will be injected here -->
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h1>Panel de Estudio</h1>
                <div class="user-profile">
                    <span>Usuario</span>
                    <div class="avatar">👤</div>
                </div>
            </header>

            <div class="workspace">
                <!-- Input Section -->
                <section class="input-section card">
                    <div class="input-header">
                        <h3>Texto de Entrada</h3>
                        <span id="char-count" class="text-muted">0 caracteres</span>
                    </div>
                    <textarea id="input-text" placeholder="Pega tu texto aquí (artículo, notas, apuntes)..."></textarea>
                    <div class="action-buttons">
                        <button id="btn-summary" class="btn primary">
                            ✨ Resumen
                        </button>
                        <div class="btn-group">
                            <button id="btn-flashcards" class="btn secondary">
                                🗂️ Flashcards
                            </button>
                            <button id="btn-flashcards-settings" class="btn icon-only" title="Configurar cantidad">
                                ✏️
                            </button>
                        </div>
                        <button id="btn-chat" class="btn secondary">
                            💬 Chat
                        </button>
                    </div>
                </section>

                <!-- Output Section -->
                <section class="output-section card">
                    <div class="output-header">
                        <h3 id="content-title">Resultado</h3>
                    </div>

                    <div id="loading" class="loading-state hidden">
                        <div class="spinner"></div>
                        <p>Analizando texto con IA...</p>
                    </div>

                    <div id="output-content" class="output-content">
                        <div class="placeholder-state">
                            <p>Los resultados aparecerán aquí</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content fade-in">
            <div class="modal-header">
                <h3>Configuración de Flashcards</h3>
                <button id="close-modal" class="close-btn">×</button>
            </div>
            <div class="modal-body">
                <label for="flashcard-count">Cantidad de tarjetas:</label>
                <div class="range-control">
                    <input type="range" id="flashcard-count" min="3" max="20" value="5">
                    <span id="flashcard-count-value">5</span>
                </div>
                <button id="save-settings" class="btn primary full-width">Guardar</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
