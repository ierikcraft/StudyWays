<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyWays - Tu Asistente de Estudio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>📚 StudyWays</h2>
            </div>
            <div class="history-container">
                <h3>Historial</h3>
                <div id="history-list" class="history-list">
                    <!-- History items will be injected here -->
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h1>Panel de Estudio</h1>
                <div class="user-profile">
                    <span>Usuario</span>
                    <div class="avatar">👤</div>
                </div>
            </header>

            <div class="workspace">
                <!-- Input Section -->
                <section class="input-section card">
                    <div class="input-header">
                        <h3>Texto de Entrada</h3>
                        <span id="char-count" class="text-muted">0 caracteres</span>
                    </div>
                    <textarea id="input-text" placeholder="Pega tu texto aquí (artículo, notas, apuntes)..."></textarea>
                    <div class="action-buttons">
                        <button id="btn-summary" class="btn primary">
                            ✨ Generar Resumen
                        </button>
                        <button id="btn-flashcards" class="btn secondary">
                            🗂️ Crear Flashcards
                        </button>
                    </div>
                </section>

                <!-- Output Section -->
                <section class="output-section card">
                    <div class="output-header">
                        <h3 id="content-title">Resultado</h3>
                    </div>

                    <div id="loading" class="loading-state hidden">
                        <div class="spinner"></div>
                        <p>Analizando texto con IA...</p>
                    </div>

                    <div id="output-content" class="output-content">
                        <div class="placeholder-state">
                            <p>Los resultados aparecerán aquí</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
